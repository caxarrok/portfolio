<!DOCTYPE html>
<html lang="uk">

<head>
    <link rel="stylesheet" href="styles.css">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Контакти">
    <meta name="author" content="Марія Оскорбіна">

    <title>Контакти — Портфоліо</title>
</head>

<body>

<div class="page">

    <header class="header">

        <h1>Контакти</h1>

        <nav class="nav">

            <input type="checkbox" id="menu-toggle" class="menu-toggle">

            <label for="menu-toggle" class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </label>

            <ul class="nav-list">
                <li><a class="nav-link" href="index.html">Головна</a></li>
                <li><a class="nav-link" href="about.html">Про мене</a></li>
                <li><a class="nav-link" href="contacts.html">Контакти</a></li>
            </ul>

        </nav>

    </header>

    <main class="content">

        <section class="section">

            <h2>Контактна інформація</h2>

            <p>
                Email:
                <a class="link" href="mailto:test@gmail.com">test@gmail.com</a>
            </p>

            <p>
                Телефон:
                <a class="link" href="tel:+380991112233">+380991112233</a>
            </p>

        </section>

        <section class="section">

            <h2>Форма зворотного зв'язку</h2>

            <form class="form" action="#" method="post">

                <fieldset class="fieldset">

                    <legend>Контактна інформація</legend>

                    <div class="form-group">

                        <label for="name">Ім'я:</label>

                        <input
                                type="text"
                                id="name"
                                name="name"
                                placeholder="Ваше ім'я"
                                required
                                class="input"
                        >

                    </div>

                    <div class="form-group">

                        <label for="email">Email:</label>

                        <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="email@example.com"
                                required
                                class="input"
                        >

                    </div>

                </fieldset>

                <fieldset class="fieldset">

                    <legend>Повідомлення</legend>

                    <div class="form-group">

                        <label for="subject">Тема:</label>

                        <select id="subject" name="subject" class="input" required>

                            <option value="">-- Оберіть тему --</option>
                            <option value="general">Загальне питання</option>
                            <option value="cooperation">Співпраця</option>
                            <option value="feedback">Відгук</option>

                        </select>

                    </div>

                    <p>Тип звернення:</p>

                    <label><input type="radio" name="type" value="question" required> Питання</label>
                    <label><input type="radio" name="type" value="suggestion"> Пропозиція</label>
                    <label><input type="radio" name="type" value="complaint"> Скарга</label>

                    <br><br>

                    <label for="message">Повідомлення:</label>

                    <textarea
                            id="message"
                            name="message"
                            rows="5"
                            placeholder="Ваше повідомлення"
                            class="input textarea"
                            required
                    ></textarea>

                </fieldset>

                <label class="checkbox">
                    <input type="checkbox" name="consent" required>
                    Я погоджуюсь на обробку персональних даних
                </label>

                <button type="submit" class="button">
                    Надіслати
                </button>

            </form>

        </section>

        <section class="section">

            <h2>Аудіо</h2>

            <figure class="card">

                <audio controls>
                    <source src="audio/music.mp3" type="audio/mpeg">
                    Ваш браузер не підтримує аудіо.
                </audio>

                <figcaption>Улюблена музика</figcaption>

            </figure>

        </section>

    </main>

    <aside class="sidebar">
        <p>Sidebar: контакти, соцмережі або додаткова інформація</p>
    </aside>

    <footer class="footer">
        <p>&copy; 2026 Марія Оскорбіна</p>
    </footer>

    <a href="#" class="back-to-top">↑</a>

</div>

</body>
</html>
