<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <meta
            name="description"
            content="Контакти"
    >

    <meta
            name="author"
            content="Твоє ім'я"
    >

    <title>
        Контакти — Портфоліо
    </title>
</head>

<body>

<header>

    <h1>
        Контакти
    </h1>

    <nav>

        <ul>

            <li>
                <a href="index.html">
                    Головна
                </a>
            </li>

            <li>
                <a href="about.html">
                    Про мене
                </a>
            </li>

            <li>
                <a href="contacts.html">
                    Контакти
                </a>
            </li>

        </ul>

    </nav>

</header>

<main>

    <section>

        <h2>
            Контактна інформація
        </h2>

        <p>

            Email:

            <a href="mailto:test@gmail.com">
                test@gmail.com
            </a>

        </p>

        <p>

            Телефон:

            <a href="tel:+380991112233">
                +380991112233
            </a>

        </p>

    </section>

    <section>

        <h2>
            Форма зворотного зв'язку
        </h2>

        <form
                action="#"
                method="post"
        >

            <fieldset>

                <legend>
                    Контактна інформація
                </legend>

                <label for="name">
                    Ім'я:
                </label>

                <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Ваше ім'я"
                        required
                >

                <br>
                <br>

                <label for="email">
                    Email:
                </label>

                <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="email@example.com"
                        required
                >

            </fieldset>

            <br>

            <fieldset>

                <legend>
                    Повідомлення
                </legend>

                <label for="subject">
                    Тема:
                </label>

                <select
                        id="subject"
                        name="subject"
                        required
                >

                    <option value="">
                        -- Оберіть тему --
                    </option>

                    <option value="general">
                        Загальне питання
                    </option>

                    <option value="cooperation">
                        Співпраця
                    </option>

                    <option value="feedback">
                        Відгук
                    </option>

                </select>

                <p>
                    Тип звернення:
                </p>

                <label>

                    <input
                            type="radio"
                            name="type"
                            value="question"
                            required
                    >

                    Питання

                </label>

                <label>

                    <input
                            type="radio"
                            name="type"
                            value="suggestion"
                    >

                    Пропозиція

                </label>

                <label>

                    <input
                            type="radio"
                            name="type"
                            value="complaint"
                    >

                    Скарга

                </label>

                <br>
                <br>

                <label for="message">
                    Повідомлення:
                </label>

                <br>

                <textarea
                        id="message"
                        name="message"
                        rows="5"
                        cols="40"
                        placeholder="Ваше повідомлення"
                        required
                ></textarea>

            </fieldset>

            <br>

            <label>

                <input
                        type="checkbox"
                        name="consent"
                        required
                >

                Я погоджуюсь на обробку персональних даних

            </label>

            <br>
            <br>

            <button type="submit">
                Надіслати
            </button>

        </form>

    </section>

    <section>

        <h2>
            Аудіо
        </h2>

        <figure>

            <audio controls>

                <source
                        src="audio/music.mp3"
                        type="audio/mpeg"
                >

                Ваш браузер не підтримує аудіо.

            </audio>

            <figcaption>
                Улюблена музика
            </figcaption>

        </figure>

    </section>

</main>

<footer>

    <p>
        &copy; 2026 Марія Оскорбіна
    </p>

</footer>

</body>

</html>
